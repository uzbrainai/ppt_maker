# nginx site for slidewind — serves the web build and reverse-proxies the API.
# Install:  sudo cp deploy/nginx/slidewind.conf /etc/nginx/sites-available/slidewind
#           sudo ln -s /etc/nginx/sites-available/slidewind /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with:  sudo certbot --nginx -d your-domain.com
#
# Replace your-domain.com and the root path before using.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Static web build (Vite output).
    root /var/www/slidewind/front/web/dist;
    index index.html;

    client_max_body_size 12m;

    # SPA: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → slidewind service on localhost. Trailing slashes strip the /api prefix:
    #   /api/generate/stream  →  http://127.0.0.1:8081/generate/stream
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (live progress) + long generations: no buffering,
        # generous timeouts. The service also sends X-Accel-Buffering: no.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
